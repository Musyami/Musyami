<svg xmlns="http://www.w3.org/2000/svg" xmlns:xlink="http://www.w3.org/1999/xlink" viewBox="0 0 1010 480" width="100%" height="100%">
  <defs>
    <style>
      .nb-font {
        font-family: system-ui, -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;
      }

      /* Animasi Geter (Shake / Vibrate Wiggle) untuk Badge Biru LET'S CONNECT */
      @keyframes shake-vibrate {
        0%, 65%, 100% {
          transform: translate(0px, 0px) rotate(0deg);
        }
        5% {
          transform: translate(-3px, -1.5px) rotate(-2deg);
        }
        10% {
          transform: translate(3px, 1.5px) rotate(2.5deg);
        }
        15% {
          transform: translate(-3.5px, 1px) rotate(-2.5deg);
        }
        20% {
          transform: translate(3.5px, -1px) rotate(2deg);
        }
        25% {
          transform: translate(-2.5px, 2px) rotate(-1.5deg);
        }
        30% {
          transform: translate(2.5px, -1.5px) rotate(1.5deg);
        }
        35% {
          transform: translate(-1.5px, 1px) rotate(-0.8deg);
        }
        40% {
          transform: translate(1.5px, -1px) rotate(0.8deg);
        }
        45%, 60% {
          transform: translate(0px, 0px) rotate(0deg);
        }
      }

      .shaking-badge {
        transform-origin: 505px 44px;
        animation: shake-vibrate 1.8s ease-in-out infinite;
      }

      /* Animasi Zoom Out (Mengecil Halus) saat Kursor Hover ke Tombol */
      .btn-hover {
        cursor: pointer;
        transition: transform 0.22s cubic-bezier(0.34, 1.56, 0.64, 1);
      }
      .btn-gmail {
        transform-origin: 505px 161px;
      }
      .btn-gmail:hover {
        transform: scale(0.95);
      }
      .btn-linkedin {
        transform-origin: 505px 257px;
      }
      .btn-linkedin:hover {
        transform: scale(0.95);
      }
      .btn-instagram {
        transform-origin: 505px 353px;
      }
      .btn-instagram:hover {
        transform: scale(0.95);
      }

      a {
        text-decoration: none;
      }
    </style>
  </defs>

  <!-- ================= 1. KOTAK KUNING UTAMA & BAYANGAN HITAM ================= -->
  <rect x="52" y="34" width="940" height="428" rx="22" fill="#000000" />
  <rect x="42" y="24" width="940" height="428" rx="22" fill="#FFF827" stroke="#000000" stroke-width="4.5" />

  <!-- Grid Titik-Titik 3x3 (Kiri Bawah) -->
  <g fill="#CDC832">
    <circle cx="68" cy="390" r="4.5" />
    <circle cx="92" cy="390" r="4.5" />
    <circle cx="116" cy="390" r="4.5" />
    <circle cx="68" cy="414" r="4.5" />
    <circle cx="92" cy="414" r="4.5" />
    <circle cx="116" cy="414" r="4.5" />
    <circle cx="68" cy="438" r="4.5" />
    <circle cx="92" cy="438" r="4.5" />
    <circle cx="116" cy="438" r="4.5" />
  </g>

  <!-- Grid Titik-Titik 3x3 (Kanan Atas) -->
  <g fill="#CDC832">
    <circle cx="910" cy="54" r="4.5" />
    <circle cx="934" cy="54" r="4.5" />
    <circle cx="958" cy="54" r="4.5" />
    <circle cx="910" cy="78" r="4.5" />
    <circle cx="934" cy="78" r="4.5" />
    <circle cx="958" cy="78" r="4.5" />
    <circle cx="910" cy="102" r="4.5" />
    <circle cx="934" cy="102" r="4.5" />
    <circle cx="958" cy="102" r="4.5" />
  </g>

  <!-- ================= 2. TOMBOL 1: GMAIL (LINK KE EMAIL + ZOOM OUT) ================= -->
  <a xlink:href="mailto:musyami.20@gmail.com" href="mailto:musyami.20@gmail.com" target="_blank" rel="noopener noreferrer">
    <g class="btn-hover btn-gmail">
      <rect x="268" y="135" width="490" height="70" rx="16" fill="#000000" />
      <rect x="260" y="126" width="490" height="70" rx="16" fill="#FF3823" stroke="#000000" stroke-width="4.5" />
      <text class="nb-font" x="505" y="170" font-size="28" font-weight="900" fill="#FFFFFF" text-anchor="middle" letter-spacing="0.3">
        Gmail
      </text>
    </g>
  </a>

  <!-- ================= 3. TOMBOL 2: LINKEDIN (LINK KE LINKEDIN + ZOOM OUT) ================= -->
  <a xlink:href="https://www.linkedin.com/in/muhammad-rasya-islami-122744347" href="https://www.linkedin.com/in/muhammad-rasya-islami-122744347" target="_blank" rel="noopener noreferrer">
    <g class="btn-hover btn-linkedin">
      <rect x="268" y="231" width="490" height="70" rx="16" fill="#000000" />
      <rect x="260" y="222" width="490" height="70" rx="16" fill="#297DFA" stroke="#000000" stroke-width="4.5" />
      <text class="nb-font" x="505" y="266" font-size="28" font-weight="900" fill="#FFFFFF" text-anchor="middle" letter-spacing="0.3">
        linkedIn
      </text>
    </g>
  </a>

  <!-- ================= 4. TOMBOL 3: INSTAGRAM (LINK KE IG + ZOOM OUT) ================= -->
  <a xlink:href="https://www.instagram.com/musyami._/" href="https://www.instagram.com/musyami._/" target="_blank" rel="noopener noreferrer">
    <g class="btn-hover btn-instagram">
      <rect x="268" y="327" width="490" height="70" rx="16" fill="#000000" />
      <rect x="260" y="318" width="490" height="70" rx="16" fill="#E427E8" stroke="#000000" stroke-width="4.5" />
      <text class="nb-font" x="505" y="362" font-size="28" font-weight="900" fill="#FFFFFF" text-anchor="middle" letter-spacing="0.3">
        Instagram
      </text>
    </g>
  </a>

  <!-- ================= 5. CARD BIRU: LET'S CONNECT (ANIMASI GETER) ================= -->
  <g class="shaking-badge">
    <animateTransform
      attributeName="transform"
      type="rotate"
      values="0 505 44; -2.5 505 44; 2.5 505 44; -3 505 44; 3 505 44; -1.5 505 44; 1.5 505 44; -0.5 505 44; 0 505 44; 0 505 44"
      keyTimes="0; 0.06; 0.12; 0.18; 0.24; 0.30; 0.36; 0.42; 0.50; 1"
      dur="1.8s"
      repeatCount="indefinite" />

    <rect x="345" y="16" width="340" height="66" rx="16" fill="#000000" />
    <rect x="335" y="6" width="340" height="66" rx="16" fill="#297DFA" stroke="#000000" stroke-width="4.5" />
    <text class="nb-font" x="505" y="50" font-size="28" font-weight="900" fill="#FFFFFF" text-anchor="middle" letter-spacing="0.4">
      LET’S CONNECT
    </text>
  </g>
</svg>
