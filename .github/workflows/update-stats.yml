name: Update Nintendo Stats Daily

on:
  schedule:
    # Otomatis jalan tiap hari jam 00:00 UTC
    - cron: '0 0 * * *'
  # Otomatis jalan juga tiap kali kamu push commit ke main
  push:
    branches: [ main ]
  # Bisa ditest jalan manual kapan saja lewat tab Actions
  workflow_dispatch:

jobs:
  update-stats:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.x'

      - name: Sync Stats with Live GitHub API
        run: python sync_stats.py

      - name: Commit & Push Changes
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"
          git add nintendo_stats.svg
          git commit -m "chore: auto-update nintendo stats [skip ci]" || exit 0
          git push
