name: Update Nintendo Stats Daily

on:
  schedule:
    - cron: '0 0 * * *' # Jalan otomatis tiap jam 12 malam
  workflow_dispatch: # Biar bisa diklik manual lewat tab Actions

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repo
        uses: actions/checkout@v3

      - name: Set up Python
        uses: actions/setup-python@v4
        with:
          python-version: '3.10'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install requests

      - name: Run update script
        run: python scripts/update_stats.py

      - name: Commit and push if changes
        uses: stefanzweifel/git-auto-commit-action@v4
        with:
          commit_message: "Auto-update Nintendo stats"
          file_patterns: nintendo_stats.svg
