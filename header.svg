<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1010 395" width="100%" height="100%">
  <defs>
    <style>
      .nb-font {
        font-family: system-ui, -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, 'Helvetica Neue', Arial, sans-serif;
      }

      /* Animasi Naik-Turun (Floating) untuk Card Hijau Welcome */
      @keyframes float-card {
        0%, 100% {
          transform: translateY(0px);
        }
        50% {
          transform: translateY(-8px);
        }
      }

      .floating-badge {
        animation: float-card 2.6s ease-in-out infinite;
      }

      /* Animasi Tangan Melambai */
      @keyframes waving-animation {
        0% { transform: rotate(0deg); }
        15% { transform: rotate(22deg); }
        30% { transform: rotate(-10deg); }
        45% { transform: rotate(22deg); }
        60% { transform: rotate(-6deg); }
        75% { transform: rotate(14deg); }
        85% { transform: rotate(0deg); }
        100% { transform: rotate(0deg); }
      }

      .waving-hand {
        display: inline-block;
        transform-origin: 25px 50px;
        animation: waving-animation 2.2s infinite ease-in-out;
      }
    </style>

    <!-- Clip Path Masking untuk Animasi Mengetik Teks "Haloo, I’am Rasya!" -->
    <clipPath id="typing-mask">
      <rect x="90" y="105" width="0" height="85">
        <animate 
          attributeName="width" 
          values="0; 0; 565; 565; 0" 
          keyTimes="0; 0.08; 0.52; 0.88; 1" 
          dur="5s" 
          repeatCount="indefinite" />
      </rect>
    </clipPath>
  </defs>

  <!-- ================= 1. KOTAK KUNING UTAMA & BAYANGAN HITAM ================= -->
  <!-- Bayangan Hitam Tebal Khas Neo-Brutalism -->
  <rect x="52" y="44" width="940" height="340" rx="22" fill="#000000" />
  
  <!-- Kotak Kuning Utama -->
  <rect x="42" y="34" width="940" height="340" rx="22" fill="#FFF827" stroke="#000000" stroke-width="4.5" />

  <!-- Grid Titik-Titik 3x3 (Kanan Atas) -->
  <g fill="#CDC832">
    <circle cx="905" cy="65" r="4" />
    <circle cx="930" cy="65" r="4" />
    <circle cx="955" cy="65" r="4" />
    <circle cx="905" cy="90" r="4" />
    <circle cx="930" cy="90" r="4" />
    <circle cx="955" cy="90" r="4" />
    <circle cx="905" cy="115" r="4" />
    <circle cx="930" cy="115" r="4" />
    <circle cx="955" cy="115" r="4" />
  </g>

  <!-- ================= 2. TEKS NGETIK: "Haloo, I’am Rasya!" ================= -->
  <!-- Teks Terketik Otomatis -->
  <g clip-path="url(#typing-mask)">
    <text class="nb-font" x="92" y="176" font-size="62" font-weight="900" fill="#000000" letter-spacing="-1">Haloo, I’am Rasya!</text>
  </g>

  <!-- Garis Kursor Mengetik Berkedip -->
  <rect y="122" width="5.5" height="60" rx="2" fill="#000000">
    <animate 
      attributeName="x" 
      values="92; 92; 652; 652; 92" 
      keyTimes="0; 0.08; 0.52; 0.88; 1" 
      dur="5s" 
      repeatCount="indefinite" />
    <animate 
      attributeName="opacity" 
      values="1; 0; 1" 
      dur="0.8s" 
      repeatCount="indefinite" />
  </rect>

  <!-- ================= 3. EMOJI TANGAN MELAMBAI 👋 ================= -->
  <g transform="translate(664, 114)">
    <g class="waving-hand">
      <animateTransform
        attributeName="transform"
        type="rotate"
        values="0 25 50; 22 25 50; -10 25 50; 22 25 50; -6 25 50; 14 25 50; 0 25 50; 0 25 50"
        keyTimes="0; 0.15; 0.3; 0.45; 0.6; 0.75; 0.85; 1"
        dur="2.2s"
        repeatCount="indefinite" />
      <text x="0" y="56" font-size="62">👋</text>
    </g>
  </g>

  <!-- ================= 4. TEKS SUBTITLE ================= -->
  <text class="nb-font" x="92" y="244" font-size="29" font-weight="800" fill="#000000" letter-spacing="-0.4">
    Undergraduate Information Systems ITS
  </text>

  <!-- ================= 5. CARD BIRU DENGAN LOGO PIN LOKASI RESMI ================= -->
  <g transform="translate(0, 0)">
    <!-- Bayangan Hitam Card Biru -->
    <rect x="104" y="296" width="375" height="52" rx="18" fill="#000000" />
    
    <!-- Card Biru -->
    <rect x="96" y="288" width="375" height="52" rx="18" fill="#297DFA" stroke="#000000" stroke-width="4.5" />

    <!-- Logo Pin Lokasi yang Benar (Map Marker Teardrop) -->
    <g transform="translate(118, 299)">
      <!-- Bayangan Pin Halus -->
      <path d="M14 2.5C8.2 2.5 3.5 7.2 3.5 13C3.5 20.2 14 29.5 14 29.5S24.5 20.2 24.5 13C24.5 7.2 19.8 2.5 14 2.5Z" fill="#000000" opacity="0.3" transform="translate(1, 1)"/>
      <!-- Badan Pin Merah -->
      <path d="M14 2C8.2 2 3.5 6.7 3.5 12.5C3.5 19.8 14 29 14 29S24.5 19.8 24.5 12.5C24.5 6.7 19.8 2 14 2Z" fill="#FF3B30" stroke="#000000" stroke-width="2" stroke-linejoin="round"/>
      <!-- Lingkaran Titik Tengah Putih -->
      <circle cx="14" cy="12.5" r="4" fill="#FFFFFF" stroke="#000000" stroke-width="1.5"/>
    </g>

    <!-- Teks Lokasi Surabaya, Indonesia -->
    <text class="nb-font" x="155" y="323" font-size="22" font-weight="800" fill="#FFFFFF" letter-spacing="0.2">
      Surabaya, Indonesia
    </text>
  </g>

  <!-- ================= 6. CARD HIJAU: WELCOME TO MY GITHUB (ANIMASI NAIK TURUN) ================= -->
  <!-- Diletakkan di urutan paling bawah markup agar lapisannya menimpa border kotak kuning -->
  <g class="floating-badge">
    <animateTransform
      attributeName="transform"
      type="translate"
      values="0 0; 0 -8; 0 0"
      keyTimes="0; 0.5; 1"
      dur="2.5s"
      repeatCount="indefinite" />

    <!-- Bayangan Hitam Card Hijau -->
    <rect x="16" y="16" width="422" height="66" rx="16" fill="#000000" />
    
    <!-- Card Hijau -->
    <rect x="6" y="6" width="422" height="66" rx="16" fill="#1DE034" stroke="#000000" stroke-width="4.5" />
    
    <!-- Teks Putih "Welcome To My Github" -->
    <text class="nb-font" x="217" y="50" font-size="28" font-weight="900" fill="#FFFFFF" text-anchor="middle" letter-spacing="0.3">
      Welcome To My Github
    </text>
  </g>

</svg>
