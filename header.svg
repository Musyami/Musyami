<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 740 330" width="100%" height="100%">
  <defs>
    <style>
      .nb-font {
        font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif, 'Apple Color Emoji', 'Segoe UI Emoji';
      }
      .badge-bounce {
        animation: subtle-float 3.5s ease-in-out infinite;
      }
      @keyframes subtle-float {
        0%, 100% { transform: translateY(0px); }
        50% { transform: translateY(-3px); }
      }
    </style>

    <!-- Clip Path Masking untuk Animasi Mengetik -->
    <clipPath id="typing-mask">
      <rect x="58" y="102" width="0" height="60">
        <animate 
          attributeName="width" 
          values="0; 0; 305; 305; 0" 
          keyTimes="0; 0.08; 0.52; 0.88; 1" 
          dur="4.8s" 
          repeatCount="indefinite" />
      </rect>
    </clipPath>
  </defs>

  <!-- ================= 1. KOTAK KUNING UTAMA (NEO-BRUTALISM) ================= -->
  <!-- Bayangan Hitam Keras di Belakang -->
  <rect x="22" y="22" width="696" height="286" rx="18" fill="#000000" />
  
  <!-- Kotak Kuning Depan -->
  <rect x="14" y="14" width="696" height="286" rx="18" fill="#FFE600" stroke="#000000" stroke-width="4" />

  <!-- Aksen Dekorasi Grid Titik-Titik (Kanan Atas) -->
  <g fill="#000000" opacity="0.18">
    <circle cx="610" cy="45" r="3" />
    <circle cx="635" cy="45" r="3" />
    <circle cx="660" cy="45" r="3" />
    <circle cx="610" cy="70" r="3" />
    <circle cx="635" cy="70" r="3" />
    <circle cx="660" cy="70" r="3" />
    <circle cx="610" cy="95" r="3" />
    <circle cx="635" cy="95" r="3" />
    <circle cx="660" cy="95" r="3" />
  </g>

  <!-- Aksen Bintang Neo-Brutalist -->
  <g transform="translate(635, 145)">
    <path d="M 0,-18 Q 0,0 18,0 Q 0,0 0,18 Q 0,0 -18,0 Q 0,0 0,-18 Z" fill="#000000" />
  </g>
  <g transform="translate(585, 190) scale(0.6)">
    <path d="M 0,-18 Q 0,0 18,0 Q 0,0 0,18 Q 0,0 -18,0 Q 0,0 0,-18 Z" fill="#FF5E7E" stroke="#000000" stroke-width="3" />
  </g>

  <!-- Badge Ekstra (Kanan Bawah) -->
  <g class="badge-bounce" transform="translate(525, 222)">
    <rect x="4" y="4" width="155" height="40" rx="8" fill="#000000" />
    <rect x="0" y="0" width="155" height="40" rx="8" fill="#FF5E7E" stroke="#000000" stroke-width="3" />
    <text class="nb-font" x="77" y="25" font-size="12" font-weight="900" fill="#000000" text-anchor="middle" letter-spacing="0.5">DEV &amp; STUDENT ⚡</text>
  </g>

  <!-- ================= 2. KOTAK PUTIH: "WELCOME TO MY GITHUB" ================= -->
  <!-- Bayangan Hitam -->
  <rect x="44" y="44" width="225" height="34" rx="8" fill="#000000" />
  <!-- Kotak Putih -->
  <rect x="40" y="40" width="225" height="34" rx="8" fill="#FFFFFF" stroke="#000000" stroke-width="3" />
  <text class="nb-font" x="152" y="62" font-size="13" font-weight="800" fill="#000000" text-anchor="middle" letter-spacing="0.5">✨ Welcome to My Github</text>

  <!-- ================= 3. KOTAK PUTIH: GREETING (NGETIK + DADA 👋) ================= -->
  <!-- Bayangan Hitam -->
  <rect x="45" y="100" width="455" height="70" rx="12" fill="#000000" />
  <!-- Kotak Putih Utama -->
  <rect x="40" y="95" width="455" height="70" rx="12" fill="#FFFFFF" stroke="#000000" stroke-width="3.5" />

  <!-- Teks Ngetik: "Haloo, I'am Rasya!" -->
  <g clip-path="url(#typing-mask)">
    <text class="nb-font" x="58" y="139" font-size="28" font-weight="900" fill="#000000" letter-spacing="-0.5">Haloo, I'am Rasya!</text>
  </g>

  <!-- Kursor Ngetik Berkedip -->
  <rect y="115" width="3.5" height="28" rx="1" fill="#000000">
    <animate 
      attributeName="x" 
      values="58; 58; 365; 365; 58" 
      keyTimes="0; 0.08; 0.52; 0.88; 1" 
      dur="4.8s" 
      repeatCount="indefinite" />
    <animate 
      attributeName="opacity" 
      values="1; 0; 1" 
      dur="0.8s" 
      repeatCount="indefinite" />
  </rect>

  <!-- Emoji Tangan Melambai 👋 (Animasi Mengayun) -->
  <g transform="translate(378, 108)">
    <g>
      <text x="0" y="32" font-size="30">👋</text>
      <animateTransform
        attributeName="transform"
        type="rotate"
        values="0 15 25; 20 15 25; -10 15 25; 20 15 25; -6 15 25; 14 15 25; 0 15 25; 0 15 25"
        keyTimes="0; 0.15; 0.3; 0.45; 0.6; 0.75; 0.85; 1"
        dur="2.4s"
        repeatCount="indefinite" />
    </g>
  </g>

  <!-- ================= 4. TEKS SUBTITLE ================= -->
  <text class="nb-font" x="42" y="196" font-size="18" font-weight="800" fill="#000000" letter-spacing="-0.3">
    Undergraduate Information Systems ITS
  </text>

  <!-- ================= 5. CARD LOKASI: SURABAYA, INDONESIA ================= -->
  <!-- Bayangan Putih Keras Khas Neo-Brutalism -->
  <rect x="44" y="226" width="220" height="42" rx="10" fill="#FFFFFF" stroke="#000000" stroke-width="2.5" />
  <!-- Card Lokasi Hitam -->
  <rect x="40" y="222" width="220" height="42" rx="10" fill="#000000" stroke="#000000" stroke-width="2.5" />

  <!-- Logo Pin Lokasi Merah-Putih -->
  <g transform="translate(54, 233)">
    <path d="M9 1C5.13 1 2 4.13 2 8c0 4.6 7 11 7 11s7-6.4 7-11c0-3.87-3.13-7-7-7zm0 9.5c-1.38 0-2.5-1.12-2.5-2.5s1.12-2.5 2.5-2.5 2.5 1.12 2.5 2.5-1.12 2.5-2.5 2.5z" fill="#FF4757" stroke="#FFFFFF" stroke-width="0.8"/>
  </g>

  <!-- Tulisan Putih Lokasi -->
  <text class="nb-font" x="78" y="249" font-size="14" font-weight="700" fill="#FFFFFF" letter-spacing="0.2">
    Surabaya, Indonesia
  </text>
</svg>
