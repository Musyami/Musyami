<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 985 460" width="100%" height="100%">
  <defs>
    <style>
      .nb-font {
        font-family: system-ui, -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;
      }

      /* Animasi Halus Kedip Api Streak */
      @keyframes flame-pulse {
        0%, 100% { transform: scale(1); }
        50% { transform: scale(1.12); }
      }

      .flame-anim {
        transform-origin: 736px 148px;
        animation: flame-pulse 1.8s ease-in-out infinite;
      }
    </style>
  </defs>

  <!-- ========================================================================= -->
  <!-- 1. CARD KUNING (KIRI) : NINTENDO GITHUB STATS CARD                        -->
  <!-- ========================================================================= -->

  <!-- Bayangan Hitam Konsol Kuning -->
  <rect x="18" y="18" width="446" height="424" rx="32" fill="#000000" />

  <!-- Bodi Konsol Kuning -->
  <rect x="8" y="8" width="446" height="424" rx="32" fill="#FFF827" stroke="#000000" stroke-width="5" />

  <!-- ================= LAYAR GITHUB STATS (BACKGROUND PUTIH) ================= -->
  <!-- Bayangan Layar -->
  <rect x="46" y="40" width="374" height="246" rx="18" fill="#000000" />

  <!-- Layar Putih Utama -->
  <rect x="38" y="32" width="374" height="246" rx="18" fill="#FFFFFF" stroke="#000000" stroke-width="4.5" />

  <!-- Header Layar Stats: Badge Biru "GitHub Stats" -->
  <rect x="54" y="46" width="170" height="32" rx="8" fill="#297DFA" stroke="#000000" stroke-width="3" />
  <text class="nb-font" x="139" y="68" font-size="15" font-weight="900" fill="#FFFFFF" text-anchor="middle" letter-spacing="0.5">
    GITHUB STATS
  </text>

  <!-- Lingkaran Rank Badge (A+) di Kanan Atas Layar -->
  <g transform="translate(350, 95)">
    <circle cx="2" cy="2" r="30" fill="#000000" />
    <circle cx="0" cy="0" r="30" fill="#FFF827" stroke="#000000" stroke-width="3.5" />
    <text class="nb-font" x="0" y="-8" font-size="10" font-weight="900" fill="#000000" text-anchor="middle" letter-spacing="0.5">RANK</text>
    <text class="nb-font" x="0" y="16" font-size="24" font-weight="900" fill="#FF3823" text-anchor="middle">A+</text>
  </g>

  <!-- Daftar Metrik Stats (Baris 1 - 5) -->
  <g class="nb-font" font-size="13.5" font-weight="800" fill="#000000">
    <!-- Row 1: Stars -->
    <g transform="translate(56, 108)">
      <text x="0" y="0">⭐ Total Stars Earned</text>
      <text x="210" y="0" font-weight="900" text-anchor="end" fill="#297DFA">18</text>
      <line x1="0" y1="6" x2="215" y2="6" stroke="#EEEEEE" stroke-width="1.5" />
    </g>

    <!-- Row 2: Commits -->
    <g transform="translate(56, 136)">
      <text x="0" y="0">📝 Total Commits</text>
      <text x="210" y="0" font-weight="900" text-anchor="end" fill="#297DFA">342</text>
      <line x1="0" y1="6" x2="215" y2="6" stroke="#EEEEEE" stroke-width="1.5" />
    </g>

    <!-- Row 3: PRs -->
    <g transform="translate(56, 164)">
      <text x="0" y="0">🔀 Total PRs</text>
      <text x="210" y="0" font-weight="900" text-anchor="end" fill="#297DFA">24</text>
      <line x1="0" y1="6" x2="215" y2="6" stroke="#EEEEEE" stroke-width="1.5" />
    </g>

    <!-- Row 4: Issues -->
    <g transform="translate(56, 192)">
      <text x="0" y="0">⚠️ Total Issues</text>
      <text x="210" y="0" font-weight="900" text-anchor="end" fill="#297DFA">8</text>
      <line x1="0" y1="6" x2="215" y2="6" stroke="#EEEEEE" stroke-width="1.5" />
    </g>

    <!-- Row 5: Contributed to -->
    <g transform="translate(56, 220)">
      <text x="0" y="0">📦 Contributed To</text>
      <text x="210" y="0" font-weight="900" text-anchor="end" fill="#297DFA">12</text>
      <line x1="0" y1="6" x2="215" y2="6" stroke="#EEEEEE" stroke-width="1.5" />
    </g>
  </g>

  <!-- Mini Status Bar Bawah Layar -->
  <rect x="54" y="244" width="342" height="20" rx="6" fill="#F4F4F4" stroke="#000000" stroke-width="2" />
  <text class="nb-font" x="225" y="258" font-size="10.5" font-weight="900" fill="#000000" text-anchor="middle" letter-spacing="0.5">
    ⚡ INFORMATION SYSTEMS • ITS SURABAYA
  </text>

  <!-- ================= TOMBOL D-PAD PLUS MERAH (KIRI BAWAH) ================= -->
  <g transform="translate(122, 362)">
    <path d="M -12 -33 h 24 v 21 h 21 v 24 h -21 v 21 h -24 v -21 h -21 v -24 h 21 Z" fill="#000000" />
    <path d="M -15 -36 h 24 v 21 h 21 v 24 h -21 v 21 h -24 v -21 h -21 v -24 h 21 Z" fill="#FF4027" stroke="#000000" stroke-width="4.5" stroke-linejoin="round" />
    <circle cx="-3" cy="-24" r="3" fill="#000000" opacity="0.3" />
  </g>

  <!-- ================= 4 TOMBOL BULAT MERAH (KANAN BAWAH) ================= -->
  <g>
    <circle cx="328" cy="326" r="14" fill="#000000" />
    <circle cx="324" cy="322" r="14" fill="#FF4027" stroke="#000000" stroke-width="4" />

    <circle cx="296" cy="358" r="14" fill="#000000" />
    <circle cx="292" cy="354" r="14" fill="#FF4027" stroke="#000000" stroke-width="4" />

    <circle cx="360" cy="358" r="14" fill="#000000" />
    <circle cx="356" cy="354" r="14" fill="#FF4027" stroke="#000000" stroke-width="4" />

    <circle cx="328" cy="390" r="14" fill="#000000" />
    <circle cx="324" cy="386" r="14" fill="#FF4027" stroke="#000000" stroke-width="4" />
  </g>


  <!-- ========================================================================= -->
  <!-- 2. CARD BIRU (KANAN) : NINTENDO GITHUB STREAK STATS CARD                  -->
  <!-- ========================================================================= -->

  <!-- Bayangan Hitam Konsol Biru -->
  <rect x="532" y="18" width="446" height="424" rx="32" fill="#000000" />

  <!-- Bodi Konsol Biru -->
  <rect x="522" y="8" width="446" height="424" rx="32" fill="#297DFA" stroke="#000000" stroke-width="5" />

  <!-- ================= LAYAR GITHUB STREAK (BACKGROUND PUTIH) ================= -->
  <!-- Bayangan Layar -->
  <rect x="560" y="40" width="374" height="246" rx="18" fill="#000000" />

  <!-- Layar Putih Utama -->
  <rect x="552" y="32" width="374" height="246" rx="18" fill="#FFFFFF" stroke="#000000" stroke-width="4.5" />

  <!-- Header Layar Streak: Badge Kuning "GitHub Streak Stats" -->
  <rect x="568" y="46" width="220" height="32" rx="8" fill="#FFF827" stroke="#000000" stroke-width="3" />
  <text class="nb-font" x="678" y="68" font-size="15" font-weight="900" fill="#000000" text-anchor="middle" letter-spacing="0.5">
    🔥 GITHUB STREAK STATS
  </text>

  <!-- Grid 3 Kolom Statistik Streak -->
  
  <!-- Kolom 1: Total Contributions -->
  <g transform="translate(568, 96)">
    <rect x="2" y="2" width="105" height="126" rx="12" fill="#000000" />
    <rect x="0" y="0" width="105" height="126" rx="12" fill="#F8F9FA" stroke="#000000" stroke-width="3" />
    
    <text class="nb-font" x="52" y="32" font-size="28" font-weight="900" fill="#000000" text-anchor="middle">
      486
    </text>
    <text class="nb-font" x="52" y="52" font-size="10" font-weight="900" fill="#297DFA" text-anchor="middle">
      TOTAL
    </text>
    <text class="nb-font" x="52" y="66" font-size="9" font-weight="800" fill="#666666" text-anchor="middle">
      CONTRIBUTIONS
    </text>
    <line x1="14" y1="78" x2="91" y2="78" stroke="#DDDDDD" stroke-width="1.5" />
    <text class="nb-font" x="52" y="98" font-size="9" font-weight="700" fill="#888888" text-anchor="middle">
      Sep 2025 -
    </text>
    <text class="nb-font" x="52" y="112" font-size="9" font-weight="800" fill="#000000" text-anchor="middle">
      Present
    </text>
  </g>

  <!-- Kolom 2 (Tengah - HERO STAT): Current Streak -->
  <g transform="translate(684, 96)">
    <rect x="2" y="2" width="112" height="126" rx="12" fill="#000000" />
    <rect x="0" y="0" width="112" height="126" rx="12" fill="#FFF827" stroke="#000000" stroke-width="3.5" />

    <g class="flame-anim">
      <animateTransform
        attributeName="transform"
        type="scale"
        values="1; 1.15; 1"
        keyTimes="0; 0.5; 1"
        dur="1.5s"
        repeatCount="indefinite" />
      <text class="nb-font" x="56" y="26" font-size="16" text-anchor="middle">🔥</text>
    </g>

    <text class="nb-font" x="56" y="52" font-size="30" font-weight="900" fill="#FF3823" text-anchor="middle">
      16
    </text>
    <text class="nb-font" x="56" y="68" font-size="10" font-weight="900" fill="#000000" text-anchor="middle" letter-spacing="0.5">
      DAYS STREAK
    </text>
    <line x1="14" y1="78" x2="98" y2="78" stroke="#000000" stroke-width="1.5" />
    <text class="nb-font" x="56" y="98" font-size="9" font-weight="700" fill="#444444" text-anchor="middle">
      Current Streak
    </text>
    <text class="nb-font" x="56" y="112" font-size="9" font-weight="900" fill="#000000" text-anchor="middle">
      Oct 1 - Oct 14
    </text>
  </g>

  <!-- Kolom 3: Longest Streak -->
  <g transform="translate(806, 96)">
    <rect x="2" y="2" width="105" height="126" rx="12" fill="#000000" />
    <rect x="0" y="0" width="105" height="126" rx="12" fill="#F8F9FA" stroke="#000000" stroke-width="3" />

    <text class="nb-font" x="52" y="32" font-size="28" font-weight="900" fill="#000000" text-anchor="middle">
      32
    </text>
    <text class="nb-font" x="52" y="52" font-size="10" font-weight="900" fill="#FF3823" text-anchor="middle">
      LONGEST
    </text>
    <text class="nb-font" x="52" y="66" font-size="9" font-weight="800" fill="#666666" text-anchor="middle">
      STREAK DAYS
    </text>
    <line x1="14" y1="78" x2="91" y2="78" stroke="#DDDDDD" stroke-width="1.5" />
    <text class="nb-font" x="52" y="98" font-size="9" font-weight="700" fill="#888888" text-anchor="middle">
      Aug 15 -
    </text>
    <text class="nb-font" x="52" y="112" font-size="9" font-weight="800" fill="#000000" text-anchor="middle">
      Sep 16
    </text>
  </g>

  <!-- Mini Status Bar Bawah Layar Streak -->
  <rect x="568" y="244" width="342" height="20" rx="6" fill="#F4F4F4" stroke="#000000" stroke-width="2" />
  <text class="nb-font" x="739" y="258" font-size="10.5" font-weight="900" fill="#000000" text-anchor="middle" letter-spacing="0.5">
    DAILY COMMITS • KEEP THE STREAK ON FIRE 🔥
  </text>

  <!-- ================= TOMBOL D-PAD PLUS MERAH (KANAN BAWAH) ================= -->
  <g transform="translate(636, 362)">
    <path d="M -12 -33 h 24 v 21 h 21 v 24 h -21 v 21 h -24 v -21 h -21 v -24 h 21 Z" fill="#000000" />
    <path d="M -15 -36 h 24 v 21 h 21 v 24 h -21 v 21 h -24 v -21 h -21 v -24 h 21 Z" fill="#FF4027" stroke="#000000" stroke-width="4.5" stroke-linejoin="round" />
    <circle cx="-3" cy="-24" r="3" fill="#000000" opacity="0.3" />
  </g>

  <!-- ================= 4 TOMBOL BULAT MERAH (KANAN BAWAH) ================= -->
  <g>
    <circle cx="842" cy="326" r="14" fill="#000000" />
    <circle cx="838" cy="322" r="14" fill="#FF4027" stroke="#000000" stroke-width="4" />

    <circle cx="810" cy="358" r="14" fill="#000000" />
    <circle cx="806" cy="354" r="14" fill="#FF4027" stroke="#000000" stroke-width="4" />

    <circle cx="874" cy="358" r="14" fill="#000000" />
    <circle cx="870" cy="354" r="14" fill="#FF4027" stroke="#000000" stroke-width="4" />

    <circle cx="842" cy="390" r="14" fill="#000000" />
    <circle cx="838" cy="386" r="14" fill="#FF4027" stroke="#000000" stroke-width="4" />
  </g>

</svg>
