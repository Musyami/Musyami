<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1010 480" width="100%" height="100%">
  <defs>
    <style>
      .nb-font {
        font-family: system-ui, -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;
      }

      /* Animasi Geter (Vibrate / Shake Wiggle) untuk Badge Kuning About Me */
      @keyframes shake-vibrate {
        0%, 65%, 100% {
          transform: translate(0px, 0px) rotate(0deg);
        }
        5% {
          transform: translate(-3px, -1.5px) rotate(-2deg);
        }
        10% {
          transform: translate(3px, 1.5px) rotate(2.5deg);
        }
        15% {
          transform: translate(-3.5px, 1px) rotate(-2.5deg);
        }
        20% {
          transform: translate(3.5px, -1px) rotate(2deg);
        }
        25% {
          transform: translate(-2.5px, 2px) rotate(-1.5deg);
        }
        30% {
          transform: translate(2.5px, -1.5px) rotate(1.5deg);
        }
        35% {
          transform: translate(-1.5px, 1px) rotate(-0.8deg);
        }
        40% {
          transform: translate(1.5px, -1px) rotate(0.8deg);
        }
        45%, 60% {
          transform: translate(0px, 0px) rotate(0deg);
        }
      }

      .shaking-badge {
        transform-origin: 123px 40px;
        animation: shake-vibrate 1.8s ease-in-out infinite;
      }
    </style>
  </defs>

  <!-- ================= 1. KOTAK BIRU UTAMA & BAYANGAN NEO-BRUTALISM ================= -->
  <!-- Bayangan Hitam Tebal -->
  <rect x="52" y="34" width="940" height="428" rx="22" fill="#000000" />
  
  <!-- Kotak Biru Depan -->
  <rect x="42" y="24" width="940" height="428" rx="22" fill="#297DFA" stroke="#000000" stroke-width="4.5" />

  <!-- ================= 2. TEKS DESKRIPSI ABOUT ME ================= -->
  <g transform="translate(106, 134)" class="nb-font">
    <text font-size="23" font-weight="800" fill="#FFFFFF" letter-spacing="-0.2">
      <tspan x="0" y="0">I am an Information Systems undergraduate student at Institut</tspan>
      <tspan x="0" y="32">Teknologi Sepuluh Nopember (ITS) who bridges technical</tspan>
      <tspan x="0" y="64">adaptability with organizational leadership. I specialize in AI-</tspan>
      <tspan x="0" y="96">assisted Vibe Coding and modern web platforms, alongside a</tspan>
      <tspan x="0" y="128">strong passion for robotics, microcontrollers, and hardware</tspan>
      <tspan x="0" y="160">integration. Beyond technical execution, my background leading</tspan>
      <tspan x="0" y="192">student organizations drives my ability to coordinate cross-</tspan>
      <tspan x="0" y="224">functional teams and manage complex projects. I am always open</tspan>
      <tspan x="0" y="256">to exciting collaborations and internships where I can build</tspan>
      <tspan x="0" y="288">impactful digital realities.</tspan>
    </text>
  </g>

  <!-- ================= 3. CARD KUNING "ABOUT ME" (ANIMASI GETER) ================= -->
  <!-- Diletakkan paling bawah di markup agar menimpa border kotak biru -->
  <g class="shaking-badge">
    <!-- Animasi SMIL Native untuk Kompatibilitas Penuh di GitHub -->
    <animateTransform
      attributeName="transform"
      type="rotate"
      values="0 123 40; -2.5 123 40; 2.5 123 40; -3 123 40; 3 123 40; -1.5 123 40; 1.5 123 40; -0.5 123 40; 0 123 40; 0 123 40"
      keyTimes="0; 0.06; 0.12; 0.18; 0.24; 0.30; 0.36; 0.42; 0.50; 1"
      dur="1.8s"
      repeatCount="indefinite" />

    <!-- Bayangan Hitam Card Kuning -->
    <rect x="16" y="16" width="235" height="66" rx="16" fill="#000000" />
    
    <!-- Card Kuning -->
    <rect x="6" y="6" width="235" height="66" rx="16" fill="#FFF827" stroke="#000000" stroke-width="4.5" />
    
    <!-- Teks Putih "About Me" -->
    <text class="nb-font" x="123" y="50" font-size="28" font-weight="900" fill="#FFFFFF" text-anchor="middle" letter-spacing="0.3">
      About Me
    </text>
  </g>

</svg>
